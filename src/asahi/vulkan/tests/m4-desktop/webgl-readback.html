<!doctype html><meta charset="utf-8"><title>M4 WebGL readback oracle</title>
<style>body{margin:8px;background:white}canvas{display:block;width:640px;height:480px}</style>
<canvas width="640" height="480"></canvas><pre id="result"></pre>
<script>
const canvas=document.querySelector('canvas');
const gl=canvas.getContext('webgl',{antialias:true,preserveDrawingBuffer:false});
const params=new URLSearchParams(location.search);
const readPoints=params.get("read")!=="0",animate=params.get("animate")==="1";
const result={bad:0,errors:[],samples:[],readPoints,animate,frames:1};
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
const vs=shader(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');
const fs=shader(gl.FRAGMENT_SHADER,'precision highp float;void main(){gl_FragColor=vec4(gl_FragCoord.x<320.?191.:32.,gl_FragCoord.y<240.?64.:128.,16.,255.)/255.;}');
const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw gl.getProgramInfoLog(prog);gl.useProgram(prog);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(loc);
gl.viewport(0,0,640,480);gl.drawArrays(gl.TRIANGLES,0,3);
for(const [x,y] of (readPoints?[[100,100],[500,100],[100,350],[500,350]]:[])){
 const pixel=new Uint8Array(4);gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
 const expected=[x<320?191:32,y<240?64:128,16,255];result.samples.push({x,y,actual:Array.from(pixel),expected});
 for(let i=0;i<4;i++)if(Math.abs(pixel[i]-expected[i])>1)result.bad++;
}
result.error=gl.getError();result.attributes=gl.getContextAttributes();
const debug=gl.getExtension('WEBGL_debug_renderer_info');result.renderer=debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
document.documentElement.dataset.m4Probe=JSON.stringify(result);document.querySelector('#result').textContent=JSON.stringify(result,null,2);
if(animate)requestAnimationFrame(function draw(){
 gl.drawArrays(gl.TRIANGLES,0,3);result.frames++;
 document.documentElement.dataset.m4Probe=JSON.stringify(result);
 requestAnimationFrame(draw);
});
</script>
